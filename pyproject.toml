[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mathmodel-cli"
version = "0.1.0a1"
description = "Isolated, resumable mathematical-modeling jobs powered by MathModel Skill and Codex"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "yushui2022"}]
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5", "filelock>=3.16,<4"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
mathmodel = "mathmodel_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mathmodel_cli = ["resources/*", "resources/runtime/*", "resources/runtime/.dockerignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires a running local Linux Docker engine and the built runtime image"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
