schema_version: '1'
name: contest-paper
edition: standard
inputs: problem_files
engine:
  name: codex
  model: YOUR_MODEL_ID
  effort: high
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
delivery:
  language: zh-CN
  target_pages: [18, 24]
  instructions: Follow the contest rules. Do not pad the paper to reach a page target.
runtime:
  cpus: 4
  memory_mb: 8192
  pids_limit: 256
  attempt_timeout_seconds: 7200
  max_attempts: 3
